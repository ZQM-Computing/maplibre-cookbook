<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapLibre Pattern 02: Custom Layers</title>
  <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
    .info { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 4px; z-index: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info">
    <h3>Custom Layers</h3>
    <p>Fill, line, circle, and heatmap layers.</p>
  </div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm': {
            type: 'vector',
            tiles: ['https://demotiles.maplibre.org/tiles/{z}/{x}/{y}.pbf'],
            tileSize: 512
          },
          'points': {
            type: 'geojson',
            data: {
              type: 'FeatureCollection',
              features: [
                { type: 'Feature', geometry: { type: 'Point', coordinates: [-80.93, 29.02] }, properties: { name: 'A', value: 10 } },
                { type: 'Feature', geometry: { type: 'Point', coordinates: [-80.92, 29.03] }, properties: { name: 'B', value: 20 } },
                { type: 'Feature', geometry: { type: 'Point', coordinates: [-80.91, 29.01] }, properties: { name: 'C', value: 30 } }
              ]
            }
          }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': '#f0f0f0' } },
          { id: 'osm', type: 'fill', source: 'osm', 'source-layer': 'landuse', paint: { 'fill-color': '#d4e6c3' } },
          {
            id: 'points-circle',
            type: 'circle',
            source: 'points',
            paint: {
              'circle-radius': ['interpolate', ['linear'], ['get', 'value'], 10, 5, 30, 15],
              'circle-color': '#e07b24',
              'circle-opacity': 0.7
            }
          },
          {
            id: 'points-label',
            type: 'symbol',
            source: 'points',
            layout: { 'text-field': ['get', 'name'], 'text-size': 12 },
            paint: { 'text-color': '#333' }
          }
        ]
      },
      center: [-80.92, 29.02],
      zoom: 10
    });

    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
