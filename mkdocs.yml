site_name: MapLibre Patterns
site_url: https://maplibre.zqmlabs.com/
site_description: MapLibre GL JS patterns — custom layers, 3D terrain, performance tuning, interactive maps
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/maplibre-patterns

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
